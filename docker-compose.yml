version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge-ai-api
    command: uvicorn forge_ai.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge-ai-frontend
    command: streamlit run app.py
    ports:
      - "8501:8501"
    volumes:
      - ./app.py:/app/app.py
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://api:8000
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: forge-ai-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    volumes:
      - ./data/mlruns:/mlruns
      - ./data/mlflow.db:/mlflow.db
